[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco_sim_publisher"
version = "0.1.0"
description = "MuJoCo simulation backend that consumes joint_action and publishes simulated jointstate"
requires-python = ">=3.11, <3.12"
dependencies = [
    "dora-rs>=0.5.0",
    "mujoco>=3.3.0",
    "numpy>=1.24",
    "pyarrow>=23.0.1",
]

[project.scripts]
mujoco-sim-publisher = "mujoco_sim_publisher.publisher:main"
mujoco-sim-test-source = "mujoco_sim_publisher.test_source:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mujoco_sim_publisher*"]
