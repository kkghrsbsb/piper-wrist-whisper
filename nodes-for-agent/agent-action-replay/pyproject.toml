[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_action_replay"
version = "0.1.0"
description = "Agent-oriented single-node Piper NPZ action replay"
requires-python = ">=3.11, <3.12"
dependencies = [
    "dora-rs>=0.5.0",
    "numpy>=1.24",
    "piper-control>=1.5.0",
    "pyarrow>=23.0.1",
]

[project.scripts]
agent-action-replay = "agent_action_replay.replay:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agent_action_replay*"]
