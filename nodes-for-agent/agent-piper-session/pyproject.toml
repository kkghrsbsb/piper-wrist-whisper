[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_piper_session"
version = "0.1.0"
description = "Agent-oriented Piper prepare and disable nodes for serial dora execution"
requires-python = ">=3.11, <3.12"
dependencies = [
    "dora-rs>=0.5.0",
    "numpy>=1.24",
    "piper-control>=1.5.0",
    "pyarrow>=23.0.1",
]

[project.scripts]
agent-piper-prepare = "agent_piper_session.prepare:main"
agent-piper-disable = "agent_piper_session.disable:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agent_piper_session*"]
