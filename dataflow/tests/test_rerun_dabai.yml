nodes:
  - id: orbbec_camera
    path: uv
    args: run orbbec-camera
    inputs:
      tick: dora/timer/millis/33
    outputs:
      - image
      - depth
      - image_depth

  - id: rerun_viewer
    path: uv
    args: run rerun-dabai-viewer
    inputs:
      image: orbbec_camera/image
      depth: orbbec_camera/depth
      image_depth: orbbec_camera/image_depth
