nodes:
  - id: robot_state_publisher
    path: uv
    args: run robot-state-publisher
    inputs:
      tick: dora/timer/millis/33
    outputs:
      - joint_positions

  - id: mujoco_sim_viewer
    path: uv
    args: run mujoco-sim-viewer
    inputs:
      joint_positions: robot_state_publisher/joint_positions
